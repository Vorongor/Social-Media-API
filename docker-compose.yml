services:
  db:
    image: postgres:16-alpine
    container_name: social_media_db
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    container_name: social_media_api
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/code
      - media_volume:/code/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: social_media_redis

  celery:
    build:
      context: .
    container_name: social_media_celery
    command: celery -A api_config worker -l INFO
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/code

  celery-beat:
    build:
      context: .
    container_name: social_media_beat
    command: celery -A api_config beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - db
    env_file:
      - .env
    volumes:
      - .:/code

volumes:
  postgres_data:
  media_volume: